<style>

input,textarea{width:100%;min-height:48px;font:22px 'VT323',monospace;font-size:20px;background:#04101f;border:4px solid var(--blue);color:#fff;padding:8px 10px;margin:6px 0 14px;outline:0;border-radius:0}
input:focus,textarea:focus{border-color:var(--red)}
label,.lb{font:9px var(--px);color:var(--sky);text-transform:uppercase;display:block;line-height:1.6}

svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;flex:none}

.ch div small{font:20px 'VT323'}.ch div.s{border-color:var(--red);color:#fff;background:rgba(229,38,47,.18);animation:bl2 .4s steps(2) 2}.ch div.s.k{border-color:var(--sky);background:rgba(111,180,240,.15)}

.rk{width:100%;font-size:20px}.rk div{display:flex;gap:8px;padding:4px 6px;border-bottom:2px solid #1a2d4d;text-align:left}.rk .me{background:var(--red)}.rk b{margin-left:auto;font-family:var(--px);font-size:9px;line-height:2}
footer{text-align:center;color:var(--mut);font-size:17px;padding:10px 0 4px;display:flex;justify-content:center;gap:8px;align-items:center}footer img{width:18px;height:18px;image-rendering:auto}footer b{color:#e1f5fe}footer i{color:var(--sky);font-style:normal}

.met{display:grid;grid-template-columns:1fr 1fr;gap:8px}.met div{background:#04101f;border:4px solid var(--blue-d);padding:10px}.met b{display:block;font:15px var(--px);color:var(--sky);margin-bottom:6px}.met span{font:7px var(--px);color:var(--mut)}.met .r b{color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}.chips button{flex:none;min-height:44px;padding:0 10px;background:#04101f;border:4px solid var(--blue-d);color:var(--mut);font:8px var(--px)}.chips .on{border-color:var(--red);color:#fff}
.gi{border:4px solid var(--blue-d);padding:10px;margin-bottom:8px;background:#0a1730}.gi.new{border-color:var(--red);animation:bl2 1s steps(2) infinite}.tag{font:7px var(--px);padding:4px 6px;background:var(--blue);margin-right:4px;display:inline-block;margin-top:4px}.tag.r{background:var(--red)}.tag.k{background:#1f8f4b}
</style></head><body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CONFIG={name:'DIEGO',age:20,eventDateISO:'2026-11-07T21:00:00-04:00',cover:40,mapsUrl:'https://maps.app.goo.gl/kXKxyTJz7Zar8vLb9',mapsEmbed:'Cochabamba, Bolivia'/* cambia por las coordenadas exactas de la fiesta, ej: '-17.3935,-66.1570' */,whatsappGroupUrl:'https://chat.whatsapp.com/TU_LINK_GRUPO_AQUI',diegoPhone:'591XXXXXXXX',payQrUrl:'',spotifyJamUrl:'https://open.spotify.com/',scriptUrl:'https://script.google.com/macros/s/AKfycbyNIuntV5VKJ_1VjIaM-JZ3wVNxIEmVfU5hohwn0LgS2Lp8tleuq08q3QASemKKaBor/exec',atrisoftIcon:'https://i.imgur.com/Ofcaqug.png'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OK=()=>!CONFIG.scriptUrl.startsWith('PEGAR');
const api=async o=>(await fetch(CONFIG.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)})).json();
const get=async q=>(await fetch(CONFIG.scriptUrl+q)).json();
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
['gesturestart','gesturechange'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();lt=n},{passive:false});
const ICON='<svg class="i" viewBox="0 0 24 24"><path d="M12 21V10M12 10L5 4M12 10l7-6M4 14h16M7 18h10"/></svg>';
const isAdmin=new URLSearchParams(location.search).get('p')==='diego'||location.hash==='#diego';
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.1});$$('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%3)*.07+'s';io.observe(e)})}

/* ============ INVITADOS ============ */
let me=ls('dg'),srv={showQr:false},change=false;
function guest(){
$('#app').innerHTML=`
<section id="hero" class="win rv"><div class="tt"><i></i>DIEGO·TRACKER<i></i></div>
<div class="px" style="font-size:9px;color:var(--sky)">Cumpleaños número</div><div class="n20">20</div><div class="big">${CONFIG.name}</div>
<div class="ticket"><div class="px">Estás invitado a la noche</div><p style="margin-top:6px">Sábado 07 de noviembre · 21:00 hrs · Cochabamba</p></div>
<div class="cd" id="cd">${['DÍAS','HRS','MIN','SEG'].map((l,i)=>`<div><b id="c${i}">00</b><span>${l}</span></div>`).join('')}</div>
<div class="mq"><span>${'▪ 20 AÑOS ▪ 07·NOV ▪ 21:00 HRS ▪ COCHABAMBA '.repeat(6)}</span></div></section>

<section class="win rv"><div class="tt"><i></i>UBICACIÓN<i></i></div>
<div id="mapbox"><iframe id="mf" title="Mapa" loading="lazy" src="https://www.google.com/maps?q=${encodeURIComponent(CONFIG.mapsEmbed)}&z=16&output=embed"></iframe><div id="mp"><i></i><svg viewBox="0 0 16 16" width="34" height="34" shape-rendering="crispEdges" fill="#05101f"><rect x="6" y="6" width="4" height="5"/><rect x="7" y="4" width="2" height="2"/><rect x="3" y="5" width="3" height="1"/><rect x="2" y="7" width="4" height="1"/><rect x="3" y="9" width="3" height="1"/><rect x="4" y="11" width="2" height="1"/><rect x="10" y="5" width="3" height="1"/><rect x="10" y="7" width="4" height="1"/><rect x="10" y="9" width="3" height="1"/><rect x="10" y="11" width="2" height="1"/></svg></div><svg id="mw" viewBox="0 0 100 100" width="84" height="84"><g fill="rgba(20,40,90,.8)" stroke="#6fb4f0" stroke-width="1.2"><polygon points="50,2 85,15 98,50 85,85 50,98 15,85 2,50 15,15"/><g fill="none"><polygon points="50,20 74,28 80,50 74,72 50,80 26,72 20,50 26,28"/><polygon points="50,36 62,40 64,50 62,60 50,64 38,60 36,50 38,40"/></g><path d="M50 2V98M2 50H98M15 15L85 85M85 15L15 85"/></g></svg></div>
<p class="px" style="font-size:9px;margin:14px 0 4px;color:var(--sky)">Sábado 07 · 21:00 hrs</p>
<a class="btn" href="${CONFIG.mapsUrl}" target="_blank" rel="noopener">${ICON}Abrir en Google Maps</a>
<div id="qr"></div><p class="mut" style="text-align:center">Escanea para llegar</p>
</section>

<section class="win rv"><div class="tt"><i></i>LA JAM<i></i></div><div class="eq">${Array.from({length:26},(_,i)=>`<i style="animation-delay:${(i*.07)%1}s;animation-duration:${.5+(i%5)*.15}s"></i>`).join('')}</div>
<a class="btn" href="${CONFIG.spotifyJamUrl}" target="_blank" rel="noopener">Unirme a la Jam de Spotify</a><p class="mut" style="margin-top:10px">¿No puedes entrar? Escribe tu canción al confirmar y la sumamos.</p></section>

<section class="win rv"><div class="tt"><i></i>CONFIRMAR<i></i></div><div id="rs"></div></section>
<section class="win rv" id="gs" style="display:none"><div class="tt"><i></i>MINIJUEGO<i></i></div>
<div id="gw"><canvas id="gc" width="300" height="400"></canvas><div class="hud"><span id="sc">0</span><span id="bs">REC 0</span></div>
<div id="ov"><div class="px" style="font-size:14px;color:var(--red)">TENSION SWING</div><p>Mantén presionado para lanzar tu telaraña. Suelta para salir disparado. Cruza los aros. Esquiva las vigas rojas.</p><button class="btn" id="go">Jugar</button></div></div></section>
<footer><img src="${CONFIG.atrisoftIcon}" referrerpolicy="no-referrer" alt=""><span>Hecho por <b>Atri</b><i>Soft</i></span></footer>`;
tick();setInterval(tick,1000);
try{new QRCode($('#qr'),{text:CONFIG.mapsUrl,width:120,height:120})}catch(e){}
initGame();rsvpView();reveal();sync();$('#go').onclick=start;
}
function tick(){let d=Math.max(0,new Date(CONFIG.eventDateISO)-Date.now())/1e3;[86400,3600,60,1].forEach((u,i)=>{const v=Math.floor(d/u);d-=v*u;const e=$('#c'+i);if(e)e.textContent=String(v).padStart(2,'0')})}
async function sync(){if(!OK())return;try{const r=await get('?action=guest'+(me?'&id='+encodeURIComponent(me.id):''));srv=r.config||srv;if(r.guest){me=Object.assign(me,r.guest);ls('dg',me)}rsvpView()}catch(e){}}
function unlock(){const on=me&&me.status==='SI';$('#gs').style.display=on?'block':'none';if(on)reveal()}
function rsvpView(){const box=$('#rs');if(!box)return;unlock();
if(me&&me.status==='SI'&&!change){const cv=me.opcion==='COVER',left=Math.max(0,2-(me.cambios||0));
box.innerHTML=`<div class="pass"><div class="lb">Ticket #${esc(me.num||'--')}</div><div class="px" style="font-size:14px;margin:10px 0">${esc(me.name)}</div><div class="stamp">CONFIRMADO</div>
<p>${cv?`Cover: ${CONFIG.cover} Bs ${me.pagado?'· PAGADO':'· PENDIENTE'}`:'Yo traje: aporto con bebida o comida'}</p>
${cv&&!me.pagado?`<p class="mut" style="margin-top:8px">Envía el comprobante al número de Diego o paga en puerta.</p><a class="btn b" href="https://wa.me/${CONFIG.diegoPhone}?text=${encodeURIComponent('Hola Diego, soy '+me.name+'. Te envío mi comprobante del cover de '+CONFIG.cover+' Bs.')}" target="_blank" rel="noopener">Enviar comprobante</a>`:''}
${cv&&!me.pagado&&srv.showQr&&CONFIG.payQrUrl?`<div id="pq" style="background:#fff;padding:8px;margin:12px auto;width:fit-content"><img src="${esc(CONFIG.payQrUrl)}" width="200" alt="QR de pago" referrerpolicy="no-referrer"></div>`:''}
<a class="btn" href="${CONFIG.whatsappGroupUrl}" target="_blank" rel="noopener">Entrar al grupo de WhatsApp</a>
${left?`<button class="btn g" id="chg">Cambiar opción (${left} restantes)</button>`:'<p class="mut" style="margin-top:10px">Ya usaste tus 2 cambios.</p>'}</div>`;
const b=$('#chg');if(b)b.onclick=()=>{change=true;rsvpView()};return}
if(me&&me.status==='NO'&&!change){box.innerHTML=`<p class="px" style="font-size:10px">Registramos que no podrás asistir.</p><button class="btn" id="chg" style="margin-top:12px">¿Cambiaste de opinión?</button>`;$('#chg').onclick=()=>{change=true;rsvpView()};return}
const editOpt=me&&me.status==='SI';let sel=editOpt?'SI':'',opt=editOpt?me.opcion:'';
box.innerHTML=`${editOpt?'':`<label>Nombre y apellido</label><input id="fn" maxlength="60" value="${esc(me?me.name:'')}" autocomplete="name">
<label>¿Vas a ir?</label><div class="ch"><div data-v="SI">SÍ VOY</div><div data-v="NO">NO PUEDO</div></div>`}
<div id="op" style="display:${editOpt?'block':'none'}"><label>¿Cómo aportas?</label><div class="ch"><div data-o="COVER" class="k">COVER<small>${CONFIG.cover} Bs</small></div><div data-o="TRAIGO" class="k">YO TRAJE<small>llevo algo</small></div></div></div>
${editOpt?'':`<label>Canción que no puede faltar</label><input id="fs" maxlength="90"><label>Mensaje para Diego</label><textarea id="fm" rows="2" maxlength="240"></textarea>`}
<button class="btn" id="fb">${editOpt?'Guardar cambio':'Enviar'}</button><p id="fe" style="color:var(--red);margin-top:10px"></p>`;
const pk=v=>{sel=v;$$('[data-v]').forEach(d=>d.classList.toggle('s',d.dataset.v===v));$('#op').style.display=v==='SI'?'block':'none'},po=v=>{opt=v;$$('[data-o]').forEach(d=>d.classList.toggle('s',d.dataset.o===v))};
$$('[data-v]').forEach(d=>d.onclick=()=>pk(d.dataset.v));$$('[data-o]').forEach(d=>d.onclick=()=>po(d.dataset.o));if(opt)po(opt);
$('#fb').onclick=async()=>{const name=editOpt?me.name:$('#fn').value.trim();if(name.length<3)return $('#fe').textContent='Escribe tu nombre y apellido.';if(!sel)return $('#fe').textContent='Elige si vas a ir.';if(sel==='SI'&&!opt)return $('#fe').textContent='Elige cómo aportas.';
const id=(me&&me.id)||'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const b=$('#fb');b.disabled=true;b.textContent='Enviando...';
try{let r={num:Math.floor(Math.random()*90+10),cambios:0};if(OK()){r=await api({action:'rsvp',id,nombre:name,asistencia:sel,opcion:sel==='SI'?opt:'',cancion:editOpt?'':$('#fs').value.trim(),mensaje:editOpt?'':$('#fm').value.trim()});if(!r.ok){b.disabled=false;b.textContent='Enviar';return $('#fe').textContent=r.error==='limite'?'Ya usaste tus 2 cambios.':'No se pudo guardar.'}}
me=Object.assign({id,name,pagado:false},me||{},{status:sel,opcion:sel==='SI'?opt:'',num:r.num,cambios:r.cambios||0});ls('dg',me);change=false;rsvpView()}catch(e){b.disabled=false;b.textContent='Enviar';$('#fe').textContent='Sin conexión. Intenta otra vez.'}}}

/* ============ JUEGO ============ */
let gc,g;const W=300,H=400;let G=null,best=ls('best')||0;
function start(){if(!me||me.status!=='SI')return;best=Math.max(best,me.score||0);$('#bs').textContent='REC '+best;G={x:50,y:150,vx:3,vy:0,a:null,L:0,score:0,bonus:0,anc:[],rg:[],bm:[],ps:[],over:false,t:0};for(let i=0;i<80;i++){const x=130+i*(90+Math.min(i*1.5,40));G.anc.push({x,y:40+Math.random()*60});G.rg.push({x:x+55,y:150+Math.random()*130,h:0});if(i>1&&Math.random()<.5)G.bm.push({x:x+55,l:70+Math.random()*40+Math.min(i,40)})}$('#ov').style.display='none';requestAnimationFrame(loop)}
const near=()=>{let b=null,d=1e9;G.anc.forEach(a=>{if(a.x>G.x-10&&a.x<G.x+170){const k=Math.hypot(a.x-G.x,a.y-G.y);if(k<d){d=k;b=a}}});return b};
const dn=e=>{e.preventDefault();if(!G||G.over)return;const a=near();if(a){G.a=a;G.L=Math.hypot(a.x-G.x,a.y-G.y)}},up=()=>{if(G)G.a=null};
function initGame(){gc=$('#gc');g=gc.getContext('2d');gc.addEventListener('pointerdown',dn);addEventListener('pointerup',up)}
const burst=(x,y,c)=>{for(let i=0;i<12;i++)G.ps.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:1,c})};
function over(){const s=G;s.over=true;const nb=s.score>best;if(nb){best=s.score;ls('best',best);$('#bs').textContent='REC '+best}
$('#ov').style.display='flex';$('#ov').innerHTML=`<div class="px" style="font-size:12px">${nb?'¡NUEVO RÉCORD!':'GAME OVER'}</div><div class="px" style="font-size:22px;color:var(--red)">${s.score}</div><div class="px" style="font-size:8px;color:var(--sky)">RANKING</div><div class="rk" id="rk">Cargando...</div><button class="btn" id="go">Reintentar</button>`;$('#go').onclick=start;
(async()=>{if(!OK())return $('#rk').textContent='Conecta el servidor.';try{if(nb)await api({action:'saveScore',id:me.id,score:best});const r=await get('?action=ranking');const t=r.scores.slice(0,6);$('#rk').innerHTML=t.map((x,i)=>`<div class="${x.id===me.id?'me':''}"><span>${i+1}</span><span>${esc(x.nombre)}</span><b>${x.score}</b></div>`).join('')||'Sin puntajes.';const p=r.scores.findIndex(x=>x.id===me.id);if(p>5)$('#rk').innerHTML+=`<div class="me"><span>${p+1}</span><span>${esc(me.name)}</span><b>${best}</b></div>`}catch(e){$('#rk').textContent='Ranking no disponible.'}})()}
function loop(){const s=G;if(!s||s.over)return;s.t++;s.vy+=.26;
if(s.a){const dx=s.x-s.a.x,dy=s.y-s.a.y,d=Math.hypot(dx,dy);if(d>s.L){const nx=dx/d,ny=dy/d;s.x=s.a.x+nx*s.L;s.y=s.a.y+ny*s.L;const dt=s.vx*nx+s.vy*ny;if(dt>0){s.vx-=nx*dt;s.vy-=ny*dt}}s.vx*=1.003}else s.vx=Math.max(s.vx,2.6+Math.min(s.x/900,2));
s.x+=s.vx;s.y+=s.vy;
s.rg.forEach(r=>{if(!r.h&&Math.hypot(r.x-s.x,r.y-s.y)<18){r.h=1;s.bonus+=25;burst(r.x,r.y,'#e5262f');s.msg=45}});
s.bm.forEach(b=>{if(Math.abs(b.x-s.x)<9&&s.y<b.l){s.hit=1}});
if(s.y>H||s.y<-40||s.hit){over();return}
s.score=Math.floor(s.x/10)+s.bonus;$('#sc').textContent=s.score;
const cx=s.x-80;g.fillStyle='#070d18';g.fillRect(0,0,W,H);g.fillStyle='#10213d';for(let i=0;i<12;i++){const bx=i*70-((cx*.35)%70),bh=60+((i*47)%90);g.fillRect(bx,H-bh,44,bh)}
g.fillStyle='#e5262f';g.fillRect(0,H-6,W,6);
s.anc.forEach(a=>{const ax=Math.round(a.x-cx);if(ax<-10||ax>W+10)return;g.fillStyle='#1a4590';g.fillRect(ax-1,0,2,a.y);g.fillStyle=s.a===a?'#fff':'#6fb4f0';g.fillRect(ax-4,a.y-4,8,8)});
s.bm.forEach(b=>{const bx=Math.round(b.x-cx);if(bx<-10||bx>W+10)return;g.fillStyle='#e5262f';g.fillRect(bx-5,0,10,b.l);g.fillStyle='#fff';for(let y=8;y<b.l;y+=16)g.fillRect(bx-5,y,10,4)});
s.rg.forEach(r=>{const rx=Math.round(r.x-cx);if(rx<-20||rx>W+20)return;g.strokeStyle=r.h?'#3a1a22':'#fff';g.lineWidth=3;g.strokeRect(rx-12,r.y-12,24,24);g.strokeStyle=r.h?'#3a1a22':'#e5262f';g.strokeRect(rx-6,r.y-6,12,12)});
if(s.a){g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(s.a.x-cx,s.a.y);g.lineTo(s.x-cx,s.y);g.stroke()}
s.ps=s.ps.filter(q=>(q.x+=q.vx,q.y+=q.vy,q.l-=.04)>0);s.ps.forEach(q=>{g.fillStyle=q.c;g.fillRect(Math.round(q.x-cx),Math.round(q.y),4,4)});
const px=Math.round(s.x-cx),py=Math.round(s.y);g.fillStyle='#e5262f';g.fillRect(px-7,py-7,14,14);g.fillStyle='#2f6fc9';g.fillRect(px-7,py+1,14,6);g.fillStyle='#fff';g.fillRect(px-5,py-3,4,4);g.fillRect(px+1,py-3,4,4);
if(s.msg>0){s.msg--;g.fillStyle='#fff';g.font='9px "Press Start 2P"';g.fillText('+25 COMBO',90,50)}
requestAnimationFrame(loop)}

/* ============ PANEL DIEGO ============ */
let PD=null,flt='ALL',q='';
function admin(){document.title='Panel · Diego';const pin=ls('adm');
$('#app').innerHTML=`<div class="win"><div class="tt"><i></i>PANEL DIEGO<i></i></div><div id="ap"></div></div>`;
if(!pin){$('#ap').innerHTML=`<label>PIN de acceso</label><input id="pi" type="password" inputmode="numeric" maxlength="12"><button class="btn" id="pb">Entrar</button><p id="pe" style="color:var(--red);margin-top:10px"></p>`;$('#pb').onclick=()=>load($('#pi').value.trim());return}load(pin)}
async function load(pin){if(!OK()){$('#ap').innerHTML='<p>Configura scriptUrl.</p>';return}
try{const r=await get('?action=panel&pin='+encodeURIComponent(pin));if(!r.ok){ls('adm',null);admin();const e=$('#pe');if(e)e.textContent='PIN incorrecto.';return}ls('adm',pin);PD=r;PD.pin=pin;draw()}catch(e){$('#ap').innerHTML='<p>Error de conexión.</p>'}}
function draw(){const G=PD.guests,si=G.filter(x=>x.asistencia==='SI'),cv=si.filter(x=>x.opcion==='COVER'),tr=si.filter(x=>x.opcion==='TRAIGO'),pd=cv.filter(x=>x.pagado),C=CONFIG.cover;
const fl={ALL:()=>1,SI:x=>x.asistencia==='SI',NO:x=>x.asistencia==='NO',COVER:x=>x.opcion==='COVER',TRAIGO:x=>x.opcion==='TRAIGO',PAG:x=>x.pagado,PEN:x=>x.opcion==='COVER'&&!x.pagado};
const list=G.filter(x=>fl[flt](x)&&x.nombre.toLowerCase().includes(q));
$('#ap').innerHTML=`<div class="met"><div><b>${si.length}</b><span>CONFIRMADOS</span></div><div><b>${G.length-si.length}</b><span>BAJAS</span></div><div><b>${cv.length}</b><span>CON COVER</span></div><div><b>${tr.length}</b><span>YO TRAJE</span></div><div><b>${pd.length}</b><span>YA PAGARON</span></div><div><b>${cv.length-pd.length}</b><span>PENDIENTES</span></div><div><b>${cv.length*C} Bs</b><span>ESTIMADO</span></div><div class="r"><b>${pd.length*C} Bs</b><span>RECAUDADO</span></div></div>
<button class="btn ${PD.config.showQr?'':'b'}" id="tq" style="margin-top:12px">${PD.config.showQr?'Ocultar QR de pago a invitados':'Mostrar QR de pago a invitados'}</button>
<input id="sq" placeholder="Buscar" value="${esc(q)}" style="margin-top:12px;margin-bottom:0"><div class="chips">${[['ALL','Todos'],['SI','Sí'],['NO','No'],['COVER','Cover'],['TRAIGO','Traje'],['PAG','Pagados'],['PEN','Pendientes']].map(a=>`<button data-f="${a[0]}" class="${flt===a[0]?'on':''}">${a[1]}</button>`).join('')}</div>
${list.map(x=>`<div class="gi ${x.visto?'':'new'}"><b>${esc(x.nombre)}</b> <span class="mut">#${esc(x.num)}</span><br><span class="tag ${x.asistencia==='NO'?'r':''}">${x.asistencia}</span>${x.opcion?`<span class="tag">${x.opcion==='COVER'?'COVER':'YO TRAJE'}</span>`:''}${x.pagado?'<span class="tag k">PAGADO</span>':''}${x.visto?'':'<span class="tag r">NUEVO</span>'}${x.cancion?`<p class="mut">♪ ${esc(x.cancion)}</p>`:''}${x.mensaje?`<p class="mut">"${esc(x.mensaje)}"</p>`:''}${x.opcion==='COVER'?`<button class="btn ${x.pagado?'g':'b'}" data-p="${esc(x.id)}" style="margin-top:8px">${x.pagado?'Quitar pago':'Marcar pagado'}</button>`:''}</div>`).join('')||'<p class="mut">Sin resultados.</p>'}`;
$('#sq').oninput=e=>{q=e.target.value.toLowerCase();draw();const s=$('#sq');s.focus();s.setSelectionRange(99,99)};
$$('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;draw()});
$$('[data-p]').forEach(b=>b.onclick=async()=>{const x=G.find(y=>y.id===b.dataset.p);x.pagado=!x.pagado;draw();api({action:'setPaid',pin:PD.pin,id:x.id,pagado:x.pagado}).catch(()=>{})});
$('#tq').onclick=()=>{PD.config.showQr=!PD.config.showQr;draw();api({action:'setQr',pin:PD.pin,value:PD.config.showQr}).catch(()=>{})};
const nw=G.filter(x=>!x.visto).map(x=>x.id);if(nw.length)setTimeout(()=>{api({action:'markSeen',pin:PD.pin,ids:nw}).catch(()=>{})},4000)}
if(isAdmin)admin();else guest();
</script></body></html>
